<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 白ベースの色。名前は前の配色のときのまま */
    --water-deep:#F4F6F5;     /* 画面の地 */
    --water-mid:#FFFFFF;      /* 入力欄 */
    --water-card:#FFFFFF;     /* カード */
    --water-line:#D3DCDA;     /* 枠線 */
    --foam:#1E2D31;           /* 文字 */
    --foam-dim:#62777A;       /* 薄い文字 */
    --buoy-gold:#A87414;      /* 金色の文字・線 */
    --buoy-gold-dim:#E2C27F;  /* 金色の薄い枠 */
    --gold-fill:#E3AD45;      /* 金色のボタン */
    --danger:#C8372C;
    --danger-line:#EDC1BC;
    --shadow:rgba(30,45,49,0.14);
    /* ペラ表の図 */
    --chart-bg:#F8FAF9;
    --chart-axis:#9DB0AD;
    --chart-text:#1E2D31;
    --chart-halo:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--water-deep);
    color:var(--foam); font-family:'Noto Sans JP', sans-serif;
    min-height:100vh; padding-bottom:100px;
  }
  .tabular{font-variant-numeric: tabular-nums;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(244,246,245,0.97) 78%, rgba(244,246,245,0.0));
    backdrop-filter:blur(6px); padding:18px 18px 10px;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between;}
  .brand h1{
    font-family:'Oswald', sans-serif; font-weight:700; font-size:22px;
    margin:0; letter-spacing:0.04em; color:var(--foam);
  }
  .brand h1 span{color:var(--buoy-gold);}
  .brand .count{font-family:'Oswald', sans-serif; font-size:13px; color:var(--foam-dim);}
  .tabs{display:flex; gap:8px; margin-top:14px;}
  .tab-btn{
    flex:1; padding:10px 6px; text-align:center;
    background:transparent; border:1px solid var(--water-line);
    border-radius:8px; color:var(--foam-dim);
    font-family:'Oswald'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .tab-btn.active{background:rgba(217,164,65,0.14); border-color:var(--buoy-gold-dim); color:var(--buoy-gold);}
  .wave-rule{
    height:2px; margin-top:14px;
    background:repeating-linear-gradient(90deg, var(--buoy-gold) 0 10px, transparent 10px 16px);
    opacity:0.6;
  }
  main{padding:14px 18px 0;}
  .view{display:none;}
  .view.active{display:block;}

  .add-btn{
    width:100%; padding:14px; background:var(--gold-fill); color:#241a05;
    border:none; border-radius:10px; font-family:'Oswald'; font-weight:600;
    font-size:15px; letter-spacing:0.03em; margin:16px 0; cursor:pointer;
  }
  .add-btn:active{transform:scale(0.98);}

  .form-panel{
    background:var(--water-card); border:1px solid var(--water-line);
    border-radius:14px; padding:18px; margin-bottom:20px; display:none;
  }
  .form-panel.open{display:block;}
  .form-panel h2{font-family:'Oswald'; font-size:16px; margin:0 0 14px; color:var(--buoy-gold);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--foam-dim); margin-bottom:6px; font-weight:500;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  input[type=text], input[type=date], select, textarea{
    width:100%; background:var(--water-mid); border:1px solid var(--water-line);
    color:var(--foam); border-radius:8px; padding:10px 12px;
    font-family:'Noto Sans JP'; font-size:16px;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--buoy-gold);}
  textarea{resize:vertical; min-height:60px; line-height:1.8;}

  .form-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-save{
    flex:1; padding:12px; background:var(--gold-fill); color:#241a05;
    border:none; border-radius:8px; font-family:'Oswald'; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn-cancel{
    padding:12px 18px; background:transparent; color:var(--foam-dim);
    border:1px solid var(--water-line); border-radius:8px; cursor:pointer; font-size:13px;
  }

  .empty{text-align:center; color:var(--foam-dim); padding:40px 20px; font-size:14px; line-height:1.8;}
  .setup-entry{
    background:var(--water-card); border:1px solid var(--water-line);
    border-radius:12px; margin-bottom:12px; overflow:hidden;
  }
  .setup-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
  .meta{flex:1; min-width:0;}
  .title{font-weight:700; font-size:15px; color:var(--foam);}
  .sub{font-size:13px; color:var(--foam-dim); margin-top:3px;}
  .chevron{color:var(--foam-dim); font-size:12px; transition:transform .2s;}
  .setup-entry.open .chevron{transform:rotate(180deg);}
  .setup-body{display:none; padding:0 14px 16px; border-top:1px solid var(--water-line);}
  .setup-entry.open .setup-body{display:block;}
  .entry-actions{display:flex; gap:10px; margin-top:16px;}
  .entry-actions button{
    font-size:12.5px; padding:8px 14px; border-radius:7px; cursor:pointer;
    border:1px solid var(--water-line); background:transparent; color:var(--foam-dim);
  }
  .entry-actions .del{color:var(--danger); border-color:var(--danger-line);}
  /* ペラ表 */
  .prop-btn{
    flex:none; margin-right:10px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer;
    background:rgba(217,164,65,0.16); color:var(--buoy-gold);
    border:1px solid var(--buoy-gold-dim); border-radius:8px;
  }
  .prop-btn:active{transform:scale(0.96);}
  /* ペラの編集画面: 画面の下から出す（上のマップは見えたまま） */
  #propFormPanel{
    position:fixed; left:0; right:0; bottom:0; z-index:40; margin:0;
    max-height:42vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border-radius:16px 16px 0 0; border-bottom:none; padding:14px 16px 0;
    box-shadow:0 -6px 20px var(--shadow);
  }
  #propFormPanel .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #propFormPanel .sheet-head h2{margin:0;}
  #propFormPanel .sheet-close{background:transparent; border:none; color:var(--foam-dim); font-size:22px; line-height:1; padding:4px 8px; cursor:pointer;}
  #propFormPanel textarea{min-height:120px; resize:none; overflow:hidden;}
  #propFormPanel .form-actions{
    position:sticky; bottom:0; gap:8px; margin:0 -16px; padding:10px 16px 14px;
    background:var(--water-card); border-top:1px solid var(--water-line);
  }
  #propFormPanel .form-actions button{padding:10px 16px; font-size:13px; border-radius:8px;}
  #propFormPanel .form-actions .btn-cancel{flex:none;}
  #propFormPanel .del-row{text-align:right; margin:6px 0 14px;}
  #propFormPanel .del-row .btn-del{padding:7px 14px; font-size:12px;}
  body.prop-sheet-open #viewProp.active{padding-bottom:50vh;}
  /* 編集画面を開いている間は、マップを縮めて全体が見えるようにする */
  body.prop-sheet-open #propSvg{width:auto; height:var(--prop-chart-h, auto); max-width:100%; margin:0 auto;}
  .prop-float{position:fixed; top:10px; right:14px; z-index:50; margin:0; background:rgba(255,255,255,0.97); box-shadow:0 2px 10px var(--shadow);}
  .prop-hint{font-size:13px; color:var(--foam-dim); line-height:1.7; margin:6px 2px 0;}
  .chart-wrap{background:var(--water-card); border:1px solid var(--water-line); border-radius:14px; padding:8px; margin:12px 0 16px;}
  #propSvg{display:block; width:100%; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  #propSvg .pp{cursor:grab;}
  /* 長押しで動かせる状態になった○は少し大きく見せる */
  #propSvg .dragging circle{transform-box:fill-box; transform-origin:center; transform:scale(1.5);}
  /* 動かしている間の拡大窓 */
  #propLoupe{
    position:fixed; z-index:60; display:none; pointer-events:none;
    width:130px; height:130px; border-radius:50%; overflow:hidden;
    border:2px solid var(--buoy-gold); background:var(--chart-bg); box-shadow:0 4px 14px var(--shadow);
  }
  #propLoupe svg{display:block;}
  #propLoupe .dragging circle{transform:none;}   /* 窓の中では○を大きくしない（位置を正確に見るため） */
  #propLoupe .lp-h, #propLoupe .lp-v{position:absolute; background:rgba(30,45,49,0.55);}
  #propLoupe .lp-h{left:50%; top:50%; width:22px; height:1px; margin-left:-11px;}
  #propLoupe .lp-v{left:50%; top:50%; width:1px; height:22px; margin-top:-11px;}
  .prop-pos-line{font-family:'Oswald'; font-size:14px; color:var(--buoy-gold); margin:-4px 0 14px;}
  .btn-del{padding:12px 16px; background:transparent; color:var(--danger); border:1px solid var(--danger-line); border-radius:8px; cursor:pointer; font-size:13px;}
  .prop-list-title{font-size:13px; color:var(--foam-dim); margin:4px 2px 8px;}
  .prop-row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--water-card); border:1px solid var(--water-line); border-radius:10px; margin-bottom:8px; cursor:pointer;}
  .prop-row.sel{border-color:var(--buoy-gold);}
  .prop-dot{width:14px; height:14px; border-radius:50%; flex:none;}
  .prop-info{flex:1; min-width:0;}
  .prop-name{font-weight:700; font-size:15px; color:var(--foam);}
  .prop-sub{font-size:13px; color:var(--foam-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prop-pos{font-family:'Oswald'; font-size:13px; color:var(--buoy-gold); white-space:nowrap;}
  .loading{text-align:center; padding:40px; color:var(--foam-dim); font-size:13px;}
  /* メモ全文：日ごとのまとまり */
  /* メモ全文：日ごとの見出しを目立たせる */
  .note-body{margin-top:14px;}
  .day-block{margin-bottom:14px;}
  .day-head{
    font-size:15px; line-height:1.95; color:var(--foam);
    white-space:pre-wrap; word-break:break-word;
  }
  .day-text{font-size:15px; line-height:1.95; white-space:pre-wrap; word-break:break-word; color:var(--foam);}
  mark{background:rgba(227,173,69,0.4); color:inherit; border-radius:2px;}

  .searchbar{margin-bottom:12px;}
  .searchbar input[type=text]{
    background:var(--water-mid); border:1px solid var(--water-line);
    padding:11px 12px; font-size:16px;
  }
  .filter-row{display:flex; gap:8px; margin-top:8px;}
  .filter-row select{flex:1; padding:9px 10px; font-size:16px; background:var(--water-mid);}
  .filter-status{
    font-size:12.5px; color:var(--foam-dim); margin:10px 2px 4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .clear-link{color:var(--buoy-gold); cursor:pointer; font-size:12.5px;}

  .import-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn-mini{
    padding:9px 12px; font-size:12.5px; border-radius:7px; cursor:pointer;
    background:rgba(217,164,65,0.16); color:var(--buoy-gold);
    border:1px solid var(--buoy-gold-dim); font-weight:500;
  }
  .btn-mini:disabled{opacity:0.5;}
  .import-status{font-size:13px; color:var(--foam-dim); margin-top:10px; line-height:1.6;}
  .tagline{
    display:inline-block; font-size:12px; padding:3px 8px; border-radius:20px;
    background:var(--water-mid); color:var(--foam-dim); margin:0 5px 5px 0;
    border:1px solid var(--water-line);
  }

  .venue-list{display:flex; flex-direction:column; gap:8px;}
  .venue-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--water-card); border:1px solid var(--water-line);
    border-radius:10px; padding:13px 16px; cursor:pointer;
  }
  .venue-row .vname{font-family:'Oswald'; font-weight:600; font-size:15px; color:var(--foam);}
  .venue-row.empty-venue .vname{color:var(--foam-dim);}
  .venue-row .vcount{
    font-family:'Oswald'; font-size:12px; color:var(--buoy-gold);
    background:rgba(217,164,65,0.12); border:1px solid var(--buoy-gold-dim);
    border-radius:20px; padding:2px 9px; min-width:22px; text-align:center;
  }
  .venue-row .vcount.zero{color:var(--foam-dim); background:transparent; border-color:var(--water-line);}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; cursor:pointer;}
  .back-row .arrow{font-family:'Oswald'; font-size:14px; color:var(--buoy-gold);}
  .vtitle{font-family:'Oswald'; font-weight:700; font-size:19px; color:var(--foam);}

  .backup-box{
    margin:28px 0 10px; padding:16px;
    border:1px solid var(--water-line); border-radius:12px;
    background:rgba(30,45,49,0.03);
  }
  .backup-box .backup-title{
    font-family:'Oswald'; font-weight:600; font-size:14px;
    color:var(--foam-dim); letter-spacing:0.03em; margin-bottom:10px;
  }
  .backup-box .hint{font-size:13px; color:var(--foam-dim); line-height:1.75; margin-bottom:12px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span>メモ</span></h1>
    <div class="count tabular" id="entryCount">0 件</div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabSearch" type="button">メモ検索</button>
    <button class="tab-btn" id="tabVenue" type="button">レース場</button>
    <button class="tab-btn" id="tabProp" type="button">ペラ表</button>
  </div>
  <div class="wave-rule"></div>
</header>

<main>
<div class="view active" id="viewSearch">
  <button class="add-btn" id="toggleSetupFormBtn">＋ メモを追加</button>

  <div class="form-panel" id="setupFormPanel">
    <h2 id="setupFormTitle">メモを追加</h2>

    <div class="field">
      <label>メモ本文</label>
      <textarea id="s_body" style="min-height:320px;" placeholder="ここにメモを書く"></textarea>
    </div>

    <div class="row2">
      <div class="field"><label>レース場</label><input type="text" id="s_venue" placeholder="例: 児島" list="venueDatalist"></div>
      <div class="field"><label>開催期間</label><input type="text" id="s_period" placeholder="例: 2026.6/30-7/5"></div>
    </div>
    <div class="row2">
      <div class="field"><label>開始日(検索用)</label><input type="date" id="s_date"></div>
      <div class="field"><label>エンジン</label><input type="text" id="s_engine" placeholder="例: 49号機"></div>
    </div>
    <div class="row2">
      <div class="field"><label>気温</label><input type="text" id="s_temp" placeholder="例: 22-26℃"></div>
      <div class="field"><label>気圧</label><input type="text" id="s_press" placeholder="例: 1005-1010hPa"></div>
    </div>

    <div class="form-actions">
      <button class="btn-save" id="setupSaveBtn">保存する</button>
      <button class="btn-cancel" id="setupCancelBtn">キャンセル</button>
    </div>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="🔍 キーワード検索(ペラ、整備内容、場名など)">
    <div class="filter-row">
      <select id="filterMonth"><option value="">全期間</option></select>
    </div>
    <div class="filter-status">
      <span id="filterCount"></span>
      <span class="clear-link" id="clearFilter">条件をクリア</span>
    </div>
  </div>

  <div id="setupListArea"><div class="loading">読み込み中…</div></div>

  <div class="backup-box">
    <div class="backup-title">バックアップ</div>
    <div class="hint">
      機種変更やブラウザのデータ消去に備えて、記録をファイルに書き出せます。<br>
      新しい端末では、書き出したファイルを「読み込む」で元に戻せます。
    </div>
    <div class="import-actions">
      <button class="btn-mini" id="exportBtn" type="button">⬇️ バックアップを書き出す</button>
      <button class="btn-mini" id="importBtn" type="button">⬆️ バックアップを読み込む</button>
    </div>
    <input type="file" id="backupInput" accept=".json,application/json" style="display:none">
    <div class="import-status" id="backupStatus"></div>
  </div>
</div>

<div class="view" id="viewVenue">
  <div id="venueListWrap"><div class="venue-list" id="venueList"></div></div>
  <div id="venueDetailWrap" style="display:none;">
    <div class="back-row" id="venueBackBtn"><span class="arrow">← 一覧に戻る</span></div>
    <div class="vtitle" id="venueDetailTitle" style="margin-bottom:14px;"></div>
    <div id="venueDetailList"></div>
  </div>
</div>

<div class="view" id="viewProp">
  <div id="propMemoHead" style="display:none;">
    <div class="back-row" id="propBackBtn"><span class="arrow">← メモに戻る</span></div>
    <div class="vtitle" id="propMemoTitle" style="margin-bottom:6px;"></div>
  </div>
  <div class="prop-hint">図の好きな位置をタップして、ペラを置きます。置いた点は長押ししてから動かせます。</div>
  <div id="propSelTitle" style="display:none; margin:10px 0 0; padding:8px 12px; font-size:15px; font-weight:700; color:var(--buoy-gold); background:rgba(217,164,65,0.16); border:1px solid var(--buoy-gold-dim); border-radius:10px;"></div>
  <div class="chart-wrap" id="propChartWrap"></div>

  <div class="form-panel" id="propFormPanel">
    <div class="sheet-head">
      <h2 id="propFormTitle">ペラを追加</h2>
      <button class="sheet-close" id="propCloseX" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="field"><label>見出し</label><input type="text" id="p_name" placeholder="例: ペラA"></div>
    <div class="field"><label>メモ</label><textarea id="p_note"></textarea></div>
    <div class="del-row"><button class="btn-del" id="propDelBtn" type="button">削除</button></div>
    <div class="form-actions">
      <button class="btn-save" id="propSaveBtn" type="button">保存する</button>
      <button class="btn-cancel" id="propCancelBtn" type="button">閉じる</button>
    </div>
  </div>

  <div id="propListArea"></div>
</div>
</main>

<datalist id="venueDatalist"></datalist>

<script>
/* 保存機能: Claudeの外（通常のブラウザ）ではlocalStorageで代用する */
if(!window.storage || typeof window.storage.set !== 'function'){
  const LS_PREFIX = 'racelog:';
  window.storage = {
    async list(prefix){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
      }
      return { keys };
    },
    async get(key){
      const v = localStorage.getItem(LS_PREFIX + key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(LS_PREFIX + key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(LS_PREFIX + key);
      return { key, deleted: true };
    }
  };
}
const ALL_VENUES = [
  '桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑',
  '津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島',
  '宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'
];
const DAY_MARKERS = ['受領時','受領','前検','初日','2日目','二日目','3日目','三日目','4日目','四日目','5日目','五日目','6日目','六日目','最終日','準優','優勝戦','ペラ','スタート','エンジン','調整'];

let setupEntries = [];
let editingSetupId = null;
let browsingVenue = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function genId(p){ return p + Date.now() + Math.floor(Math.random()*1000); }
/* 読み込んだファイルのid・色は、安全な文字だけ通す(画面の部品に埋め込まれるため) */
function safeId(v){ const s = String(v==null?'':v); return /^[A-Za-z0-9_-]{1,64}$/.test(s) ? s : ''; }
function safeColor(v, fallback){ const s = String(v==null?'':v); return /^#[0-9A-Fa-f]{3,8}$/.test(s) ? s : fallback; }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(text, q){
  const safe = escapeHtml(text);
  if(!q) return safe;
  try{
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    return safe.replace(re, m => '<mark>' + m + '</mark>');
  }catch(e){ return safe; }
}
function bind(root, sel, evt, fn){ root.querySelectorAll(sel).forEach(n=>n.addEventListener(evt, fn)); }
function venueMatch(entry, name){
  if(!entry.venue) return false;
  return entry.venue === name || entry.venue.includes(name) || name.includes(entry.venue);
}

/* 本文を「前検」「初日」などの区切りごとのブロックに分けて表示する */
function isDayHeading(line){
  const t = line.trim();
  if(!t || t.length > 24) return false;
  return DAY_MARKERS.some(m => t === m || t.startsWith(m + ' ') || t.startsWith(m + '　') ||
    t === m + ':' || t === m + '：' || t.startsWith(m + ':') || t.startsWith(m + '：'));
}
function renderBodyBlocks(body, q){
  const lines = String(body||'').split('\n');
  const blocks = [];
  let cur = { head:null, lines:[] };
  lines.forEach(line=>{
    if(isDayHeading(line)){
      if(cur.head || cur.lines.some(l=>l.trim())) blocks.push(cur);
      cur = { head: line.trim(), lines: [] };
    }else{
      cur.lines.push(line);
    }
  });
  if(cur.head || cur.lines.some(l=>l.trim())) blocks.push(cur);

  return blocks.map(b=>{
    const text = b.lines.join('\n').replace(/^\n+|\n+$/g,'');
    return `<div class="day-block">
      ${b.head ? `<div class="day-head">${highlight(b.head,q)}</div>` : ''}
      ${text.trim() ? `<div class="day-text">${highlight(text,q)}</div>` : ''}
    </div>`;
  }).join('');
}

/* 旧バージョンのデータ（ペラ情報／整備内容が別欄）を本文にまとめる */
function migrate(e){
  if(e.body && e.body.trim()){
    const isAuto = /^レース場:\s/.test(e.body.trim()) &&
      (e.body.includes('【ペラ】') || e.body.includes('【整備・調整】'));
    if(!isAuto) return e;
  }
  const parts = [];
  if(e.maint) parts.push(e.maint);
  if(e.prop) parts.push('ペラ\n' + e.prop);
  if(parts.length) e.body = parts.join('\n\n');
  return e;
}

/* 本文に出てくる気温・気圧をすべて拾い、節間の最小〜最大にまとめる（例: 21-26℃ / 1005-1011hPa） */
function weatherRange(text){
  const t = String(text||'');
  const collect = (re, lo, hi) => {
    const nums = [];
    for(const m of t.matchAll(re)){
      [m[1], m[2]].forEach(s=>{
        if(s === undefined) return;
        const n = parseFloat(s);
        if(n >= lo && n <= hi) nums.push(n);
      });
    }
    return nums.length ? [Math.min(...nums), Math.max(...nums)] : null;
  };
  const fmt = (r, unit) => r ? (r[0] === r[1] ? `${r[0]}${unit}` : `${r[0]}-${r[1]}${unit}`) : '';
  return {
    temp:  fmt(collect(/(-?\d{1,2}(?:\.\d)?)\s*(?:[-–—~〜]\s*(-?\d{1,2}(?:\.\d)?)\s*)?(?:℃|°C)/gi, -20, 45), '℃'),
    press: fmt(collect(/(\d{3,4})\s*(?:[-–—~〜]\s*(\d{3,4})\s*)?(?:hpa|ヘクトパスカル)/gi, 900, 1100), 'hPa')
  };
}

/* 本文から基本情報を自動で拾う（API不要のローカル解析） */
function parseBodyLocally(text){
  const t = String(text||'');
  const out = {};

  // レース場：24場のいずれかが本文に出てくれば採用
  const hit = ALL_VENUES.find(v => t.includes(v));
  if(hit) out.venue = hit;

  // 開催期間：2026.6/30-7/5 / 2026.6/21-24 / 2026/6/30〜7/5 など
  const period = t.match(/(20\d{2})[.\/年]\s*(\d{1,2})[.\/月]\s*(\d{1,2})\s*[-–—~〜]\s*(\d{1,2})(?:[.\/月]\s*(\d{1,2}))?/);
  if(period){
    out.period = period[0].trim();
    const y = period[1], m = String(period[2]).padStart(2,'0'), d = String(period[3]).padStart(2,'0');
    out.date = `${y}-${m}-${d}`;
  }else{
    // 単独の日付表記
    const single = t.match(/(20\d{2})[.\/年]\s*(\d{1,2})[.\/月]\s*(\d{1,2})/);
    if(single){
      out.period = single[0].trim();
      out.date = `${single[1]}-${String(single[2]).padStart(2,'0')}-${String(single[3]).padStart(2,'0')}`;
    }
  }

  // 気温：22-26℃ / 22℃
  // 本文中の全部の値から、最小〜最大にまとめる
  const wr = weatherRange(t);
  if(wr.temp) out.temp = wr.temp;
  else{
    const temp = t.match(/-?\d{1,2}\s*(?:[-–—~〜]\s*-?\d{1,2}\s*)?(?:℃|°C|度)/i);
    if(temp) out.temp = temp[0].replace(/\s+/g,'');
  }
  if(wr.press) out.press = wr.press;

  // エンジン：49号機 36% / エンジン49号機
  const eng = t.match(/(\d{1,3}\s*号機[^\n]{0,20})/);
  if(eng) out.engine = eng[1].trim();

  return out;
}

async function saveSetup(){
  const g = id => document.getElementById(id).value.trim();
  const body = document.getElementById('s_body').value;
  if(!body.trim() && !g('s_venue')){ alert('メモ本文かレース場を入力してください。'); return; }

  const btn=document.getElementById('setupSaveBtn'); btn.disabled=true; btn.textContent='保存中…';

  // 空欄はまず本文から自動で拾う
  applyLocalParse();

  // それでもレース場が分からなければ、AIに整理してもらう
  if(!g('s_venue') && body.trim()){
    btn.textContent='情報を整理中…';
    try{
      const metaText = await callClaude([{ type:'text', text: META_PROMPT + body.slice(0, 3000) }]);
      let clean = metaText.replace(/```json|```/g,'').trim();
      const a = clean.indexOf('{'), b2 = clean.lastIndexOf('}');
      if(a !== -1 && b2 !== -1){
        const parsed = JSON.parse(clean.slice(a, b2+1));
        const fill = (id,val)=>{ const el=document.getElementById(id); if(val && !el.value.trim()) el.value=val; };
        fill('s_venue', parsed.venue);
        fill('s_period', parsed.period);
        fill('s_engine', parsed.engine);
        fill('s_temp', parsed.temp);
        fill('s_press', parsed.press);
        const dEl = document.getElementById('s_date');
        if(parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date) && (!dEl.value || dEl.value === todayStr())) dEl.value = parsed.date;
      }
    }catch(err){ /* 取れなくても保存は続行 */ }
    btn.textContent='保存中…';
  }

  const id = editingSetupId || genId('s');
  const data = {
    id, body, venue:g('s_venue'), period:g('s_period'),
    date: document.getElementById('s_date').value || todayStr(),
    engine:g('s_engine'), temp:g('s_temp'), press:g('s_press'),
    createdAt: editingSetupId ? (setupEntries.find(x=>x.id===editingSetupId)||{}).createdAt||Date.now() : Date.now()
  };
  try{
    const result = await window.storage.set('setup:'+id, JSON.stringify(data), false);
    if(!result) throw new Error('保存が拒否されました');
    setupEntries = editingSetupId ? setupEntries.map(x=>x.id===id?data:x) : [data, ...setupEntries];
    setupEntries.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt-a.createdAt));
    rebuildFilters(); renderSetup(); renderVenueTab(); closeSetupForm(); resetSetupForm();
  }catch(e){
    alert('保存に失敗しました。\n理由: ' + (e && e.message ? e.message : '不明なエラー'));
  }finally{ btn.disabled=false; btn.textContent='保存する'; }
}

/* ================= AUTO EXTRACTION ================= */
async function callClaude(content){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, messages:[{ role:'user', content }] })
  });
  const data = await res.json();
  if(!res.ok || data.error){
    throw new Error((data.error && data.error.message) ? data.error.message : ('HTTPエラー ' + res.status));
  }
  const text = (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  if(!text.trim()) throw new Error('応答が空でした');
  return text;
}

const META_PROMPT = `以下のボートレーサーの整備メモから、基本情報だけをJSONで抽出してください。

/* ================= PROP CHART（ペラ表） ================= */
/* x: -1=捻 〜 +1=広 / y: -1=低 〜 +1=高。画面上は 200x200 の座標で描く */
const PROP_COLORS = ['#D9A441','#5EC4E8','#E8735E','#7ED68A','#C58BE8','#E8D85E','#E88BB6','#8BA7E8'];
const PC = 100, PR = 76;
/* 図の色は、上の :root の色（--chart-…）から読む */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let propPoints = [];
let propSel = null;      // 選択中の点のid
let propDraft = null;    // 追加しようとしている位置 {x,y}
let propLastTouch = 0;   // 点の操作直後のクリックを無視するための時刻
let propScope = null;    // null=ペラ表タブ / メモのid=そのメモ（節）のペラ情報
let propReturn = null;   // メモのペラ情報から戻る先 {tab, venue, memoId}

function clampUnit(v){ return Math.max(-1, Math.min(1, Math.round(v*100)/100)); }
function propQuadrant(x, y){
  const h = Math.abs(x) < 0.08 ? '' : (x < 0 ? '捻' : '広');
  const v = Math.abs(y) < 0.08 ? '' : (y < 0 ? '低' : '高');
  return [v, h].filter(Boolean).join('・') || '中央';
}
function propVisible(){ return propPoints.filter(p => (p.memoId || null) === propScope); }
function propSorted(){ return propVisible().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); }

function renderPropChart(){
  const L = 20, R = 180;
  const t = (x,y,anchor,size,fill,txt,extra='') =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" fill="${fill}" ${extra}>${txt}</text>`;
  const cBg = cssVar('--chart-bg'), cLine = cssVar('--water-line'), cAxis = cssVar('--chart-axis'),
        cText = cssVar('--chart-text'), cHalo = cssVar('--chart-halo');
  let s = `<svg id="propSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="${L}" y="${L}" width="${R-L}" height="${R-L}" rx="4" fill="${cBg}" stroke="${cLine}"/>`;
  s += `<line x1="${L}" y1="${PC}" x2="${R}" y2="${PC}" stroke="${cAxis}" stroke-width="0.8"/>`;
  s += `<line x1="${PC}" y1="${L}" x2="${PC}" y2="${R}" stroke="${cAxis}" stroke-width="0.8"/>`;
  s += t(PC,13,'middle',11,cText,'高') + t(PC,196,'middle',11,cText,'低');
  s += t(10,PC+4,'middle',11,cText,'捻') + t(190,PC+4,'middle',11,cText,'広');
  const q = cAxis;
  s += t(L+4,L+11,'start',7,q,'高・捻','opacity="0.6"') + t(R-4,L+11,'end',7,q,'高・広','opacity="0.6"');
  s += t(L+4,R-5,'start',7,q,'低・捻','opacity="0.6"') + t(R-4,R-5,'end',7,q,'低・広','opacity="0.6"');

  // 選んだペラは最後に描く → 見出しが他の文字より手前に出る
  const pts = propSorted();
  const si = pts.findIndex(p=>p.id===propSel);
  if(si >= 0) pts.push(pts.splice(si,1)[0]);
  pts.forEach(p=>{
    const cx = PC + p.x*PR, cy = PC - p.y*PR;
    const right = cx < 130;
    const sel = p.id === propSel;
    s += `<g class="pp" data-id="${escapeHtml(p.id)}">`;
    if(sel) s += `<circle cx="${cx}" cy="${cy}" r="8.5" fill="none" stroke="${cText}" stroke-width="1.2"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${p.color||PROP_COLORS[0]}" stroke="${cHalo}" stroke-width="1"/>`;
    s += t(right?cx+9:cx-9, cy+2.5, right?'start':'end', 7.5, cText, escapeHtml(p.name),
      `stroke="${cHalo}" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round"`);
    s += `</g>`;
  });
  if(propDraft){
    const cx = PC + propDraft.x*PR, cy = PC - propDraft.y*PR;
    s += `<g class="pd"><circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/>` +
         `<circle cx="${cx}" cy="${cy}" r="6" fill="rgba(217,164,65,0.25)" stroke="#D9A441" stroke-width="1.4" stroke-dasharray="2 2"/></g>`;
  }
  s += `</svg>`;
  document.getElementById('propChartWrap').innerHTML = s;
  propSelLabelBg();
  bindPropChart();
}

function propPointFromEvent(svg, ev){
  const r = svg.getBoundingClientRect();
  const sx = (ev.clientX - r.left) / r.width * 200;
  const sy = (ev.clientY - r.top) / r.height * 200;
  return { x: clampUnit((sx-PC)/PR), y: clampUnit((PC-sy)/PR) };
}

function bindPropChart(){
  const svg = document.getElementById('propSvg');
  // 空いている場所をタップ → 追加位置を置く
  svg.addEventListener('click', ev=>{
    if(Date.now() - propLastTouch < 500) return;
    if(ev.target.closest && ev.target.closest('.pp, .pd')) return;
    const pos = propPointFromEvent(svg, ev);
    const wasEditing = propSel !== null;
    propSel = null;
    propDraft = pos;
    if(wasEditing){ document.getElementById('p_name').value=''; document.getElementById('p_note').value=''; }
    renderProp();
  });
  // 置く途中の点 → 長押ししてから、ドラッグで位置を動かす
  svg.querySelectorAll('.pd').forEach(g=>{
    propLongPressDrag(g, {
      onMove: pos=>{ propDraft = pos; renderPropChartKeep(g, propDraft); },
      onEnd: ()=>{}
    });
  });
  // 点をタップ → 選択 / 長押ししてからドラッグ → 移動
  svg.querySelectorAll('.pp').forEach(g=>{
    const id = g.dataset.id;
    const select = ()=>{
      const p = propPoints.find(x=>x.id===id); if(!p) return;
      propSel = id; propDraft = null;
      document.getElementById('p_name').value = p.name || '';
      document.getElementById('p_note').value = p.note || '';
      renderProp();
    };
    propLongPressDrag(g, {
      onTap: select,
      onMove: pos=>{
        const p = propPoints.find(x=>x.id===id); if(!p) return;
        p.x = pos.x; p.y = pos.y;
        renderPropChartKeep(g, p);
      },
      onEnd: async moved=>{
        const p = propPoints.find(x=>x.id===id); if(!p) return;
        if(moved) await savePropPoint(p);
        select();
      }
    });
  });
}

/* ○の操作: 軽いタップ → onTap / すぐ指を動かす → 普通のスクロール /
   長押し(PROP_HOLD_MS)してから動かす → ○を移動（拡大窓つき） */
const PROP_HOLD_MS = 500;   // 長押しの長さ（ミリ秒）
const PROP_SLOP = 10;       // これ以上指が動いたら「スクロール」とみなす（px）
function propLongPressDrag(g, h){
  const svg = document.getElementById('propSvg');
  let st = null;   // { x, y, timer, active, moved }
  const begin = (x, y)=>{
    st = { x, y, active:false, moved:false, sy:window.scrollY };
    st.timer = setTimeout(()=>{
      if(!st) return;
      if(Math.abs(window.scrollY - st.sy) > 2){ st = null; return; }   // 待つ間にスクロールしていたら取り消す
      st.active = true;
      g.classList.add('dragging');            // ○が少し大きくなる＝動かせる合図
      propLoupeShow({clientX:x, clientY:y});
    }, PROP_HOLD_MS);
  };
  const move = (x, y, ev)=>{
    if(!st) return;
    if(!st.active){
      if(Math.hypot(x-st.x, y-st.y) >= PROP_SLOP){ clearTimeout(st.timer); st = null; }  // スクロールに任せる
      return;
    }
    if(ev && ev.type === 'touchmove'){
      if(!ev.cancelable){ end(true); return; }   // すでにスクロールが始まっていたら、動かすのをやめる
      ev.preventDefault();
    }
    st.moved = true;
    const pt = {clientX:x, clientY:y};
    h.onMove(propPointFromEvent(svg, pt));
    propLoupeShow(pt);
  };
  const end = cancelled=>{
    if(!st) return;
    clearTimeout(st.timer);
    const s = st; st = null;
    g.classList.remove('dragging');
    propLoupeHide();
    propLastTouch = Date.now();
    if(s.active) h.onEnd && h.onEnd(s.moved);
    else if(!cancelled) h.onTap && h.onTap();
  };
  // スマホ（指）
  g.addEventListener('touchstart', ev=>{
    if(ev.touches.length !== 1){ end(true); return; }
    const t = ev.touches[0]; begin(t.clientX, t.clientY);
  }, {passive:true});
  g.addEventListener('touchmove', ev=>{
    const t = ev.touches[0]; if(t) move(t.clientX, t.clientY, ev);
  }, {passive:false});
  g.addEventListener('touchend', ev=>{ if(st && ev.cancelable) ev.preventDefault(); end(false); });
  g.addEventListener('touchcancel', ()=>end(true));
  g.addEventListener('contextmenu', ev=>ev.preventDefault());
  // パソコン（マウス）
  g.addEventListener('pointerdown', ev=>{
    if(ev.pointerType !== 'mouse') return;
    ev.preventDefault();
    g.setPointerCapture(ev.pointerId);
    begin(ev.clientX, ev.clientY);
  });
  g.addEventListener('pointermove', ev=>{ if(ev.pointerType === 'mouse') move(ev.clientX, ev.clientY, ev); });
  g.addEventListener('pointerup', ev=>{ if(ev.pointerType === 'mouse') end(false); });
  g.addEventListener('pointercancel', ev=>{ if(ev.pointerType === 'mouse') end(true); });
}

/* 拡大窓: 動かしている○とその周りを、指の少し上に大きく映す */
const PROP_LOUPE_ZOOM = 2;   // 拡大の倍率
const PROP_LOUPE_SIZE = 130;   // 窓の大きさ（px）
function propLoupeShow(pt){
  const svg = document.getElementById('propSvg'); if(!svg) return;
  let lp = document.getElementById('propLoupe');
  if(!lp){
    lp = document.createElement('div');
    lp.id = 'propLoupe';
    document.body.appendChild(lp);
  }
  const r = svg.getBoundingClientRect();
  const unit = r.width / 200;                       // 図の1目盛りが何pxか
  const span = PROP_LOUPE_SIZE / (unit * PROP_LOUPE_ZOOM);
  // 窓の中心 = 指の位置の図上の座標
  const cx = (pt.clientX - r.left) / unit, cy = (pt.clientY - r.top) / unit;
  lp.innerHTML = `<svg viewBox="${cx-span/2} ${cy-span/2} ${span} ${span}" width="${PROP_LOUPE_SIZE}" height="${PROP_LOUPE_SIZE}">` +
    `<rect x="-50" y="-50" width="300" height="300" fill="${cssVar('--water-card')}"/>` + svg.innerHTML + `</svg>` +
    `<span class="lp-h"></span><span class="lp-v"></span>`;
  // 置き場所: 指の上。上の見出し部分に隠れるときは、指の横
  const head = document.querySelector('header');
  const topLimit = (head ? head.getBoundingClientRect().bottom : 0) + 6;
  const half = PROP_LOUPE_SIZE / 2;
  let x = pt.clientX, y = pt.clientY - 110;
  if(y - half < topLimit){ y = Math.max(topLimit + half, pt.clientY); x = pt.clientX + (pt.clientX < window.innerWidth/2 ? 110 : -110); }
  x = Math.max(half + 4, Math.min(window.innerWidth - half - 4, x));
  lp.style.left = (x - half) + 'px';
  lp.style.top = (y - half) + 'px';
  lp.style.display = 'block';
}
function propLoupeHide(){
  const lp = document.getElementById('propLoupe');
  if(lp) lp.style.display = 'none';
}
/* ドラッグ中は点だけ動かす（全体を描き直さない） */
function renderPropChartKeep(g, p){
  const dx = p.x*PR, dy = -p.y*PR;
  const base = PC;
  g.querySelectorAll('circle').forEach(c=>{ c.setAttribute('cx', base+dx); c.setAttribute('cy', base+dy); });
  const txt = g.querySelector('text');
  if(txt){
    const right = (base+dx) < 130;
    txt.setAttribute('x', right ? base+dx+9 : base+dx-9);
    txt.setAttribute('y', base+dy+2.5);
    txt.setAttribute('text-anchor', right ? 'start' : 'end');
  }
  if(g.dataset.id === propSel) propSelLabelBg();
}
/* 選んだペラの見出しの後ろに下地を敷き、重なった他の文字を隠す */
function propSelLabelBg(){
  const svg = document.getElementById('propSvg'); if(!svg || !propSel) return;
  const g = [...svg.querySelectorAll('.pp')].find(x=>x.dataset.id===propSel); if(!g) return;
  const txt = g.querySelector('text'); if(!txt) return;
  let bg = g.querySelector('.sel-bg');
  if(!bg){
    bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('class','sel-bg');
    bg.setAttribute('rx','2');
    bg.setAttribute('fill','rgba(255,255,255,0.94)');
    g.insertBefore(bg, txt);
  }
  try{
    const b = txt.getBBox();
    bg.setAttribute('x', b.x-2); bg.setAttribute('y', b.y-1);
    bg.setAttribute('width', b.width+4); bg.setAttribute('height', b.height+2);
  }catch(e){}
}

function renderPropForm(){
  const panel = document.getElementById('propFormPanel');
  const p = propSel ? propPoints.find(x=>x.id===propSel) : null;
  const open = !!(p || propDraft);
  panel.classList.toggle('open', open);
  const st = document.getElementById('propSelTitle');   // 選んだペラの見出しを図の上に表示
  st.textContent = (p && p.name) ? p.name : '';
  st.style.display = (p && p.name) ? 'block' : 'none';
  const wasOpen = document.body.classList.contains('prop-sheet-open');
  document.body.classList.toggle('prop-sheet-open', open);
  if(!open) return;
  document.getElementById('propFormTitle').textContent = p ? 'ペラを編集' : 'ペラを追加';
  document.querySelector('#propFormPanel .del-row').style.display = p ? '' : 'none';
  panel.scrollTop = 0;
  autoGrowPropNote();
  // マップの高さ = 画面の高さ − 上の見出し部分 − 編集画面
  const head = document.querySelector('header');
  const headH = head ? head.offsetHeight : 0;
  const chartH = Math.max(160, window.innerHeight - headH - panel.offsetHeight - 36);
  document.body.style.setProperty('--prop-chart-h', chartH + 'px');
  // 編集画面を開いたとき、上半分にマップが見えるようにスクロールする
  if(!wasOpen){
    const wrap = document.getElementById('propChartWrap');
    const y = wrap.getBoundingClientRect().top + window.scrollY - (head ? head.offsetHeight : 0) - 8;
    window.scrollTo({ top: Math.max(0, y), behavior:'smooth' });
  }
}
/* メモ欄を、書いた量に合わせて伸ばす */
function autoGrowPropNote(){
  const ta = document.getElementById('p_note');
  ta.style.height = 'auto';
  ta.style.height = Math.max(120, ta.scrollHeight + 2) + 'px';
}
document.getElementById('p_note').addEventListener('input', autoGrowPropNote);
function closePropSheet(){
  propSel = null; propDraft = null;
  document.getElementById('p_name').value=''; document.getElementById('p_note').value='';
  renderProp();
}
document.getElementById('propCloseX').addEventListener('click', closePropSheet);
/* 編集画面の外をタップしても閉じる（マップとペラの一覧は除く。そこは選び直しに使う） */
document.addEventListener('click', ev=>{
  if(!document.body.classList.contains('prop-sheet-open')) return;
  if(!document.getElementById('viewProp').classList.contains('active')) return;
  const t = ev.target;
  if(!t.isConnected) return;   // 図の再描画で押した部品が消えた場合は、閉じない（新しい○を置いた直後に閉じてしまうため）
  if(!t.closest || t.closest('#propFormPanel, #propChartWrap, .prop-row, header, .prop-float')) return;
  closePropSheet();
});

function renderPropList(){
  const el = document.getElementById('propListArea');
  if(!propVisible().length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="prop-list-title">置いたペラ（${propVisible().length}）</div>` +
    propSorted().map(p=>`
      <div class="prop-row${p.id===propSel?' sel':''}" data-id="${escapeHtml(p.id)}">
        <span class="prop-dot" style="background:${escapeHtml(safeColor(p.color, PROP_COLORS[0]))}"></span>
        <div class="prop-info">
          <div class="prop-name">${escapeHtml(p.name)}</div>
          ${p.note ? `<div class="prop-sub">${escapeHtml(p.note)}</div>` : ''}
        </div>
        <span class="prop-pos">${propQuadrant(p.x,p.y)}</span>
      </div>`).join('');
  bind(el, '.prop-row', 'click', ev=>{
    const id = ev.currentTarget.dataset.id;
    const p = propPoints.find(x=>x.id===id); if(!p) return;
    propSel = id; propDraft = null;
    document.getElementById('p_name').value = p.name || '';
    document.getElementById('p_note').value = p.note || '';
    renderProp();
  });
}

async function savePropPoint(p){
  try{ await window.storage.set('prop:'+p.id, JSON.stringify(p), false); return true; }
  catch(e){ alert('保存に失敗しました。\n理由: ' + (e && e.message ? e.message : '不明なエラー')); return false; }
}

document.getElementById('propSaveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('p_name').value.trim();
  const note = document.getElementById('p_note').value.trim();
  let p = propSel ? propPoints.find(x=>x.id===propSel) : null;
  if(p){
    p.name = name || p.name; p.note = note;
  }else if(propDraft){
    p = {
      id: genId('p'), name: name || ('ペラ' + (propVisible().length+1)), note,
      x: propDraft.x, y: propDraft.y,
      color: PROP_COLORS[propVisible().length % PROP_COLORS.length],
      createdAt: Date.now()
    };
    if(propScope) p.memoId = propScope;
  }else return;
  if(!(await savePropPoint(p))) return;
  if(!propPoints.includes(p)) propPoints.push(p);
  propSel = null; propDraft = null;
  document.getElementById('p_name').value=''; document.getElementById('p_note').value='';
  renderProp();
});
document.getElementById('propCancelBtn').addEventListener('click', closePropSheet);
document.getElementById('propDelBtn').addEventListener('click', async ()=>{
  const p = propPoints.find(x=>x.id===propSel); if(!p) return;
  if(!confirm('「' + p.name + '」を削除しますか？')) return;
  try{
    await window.storage.delete('prop:'+p.id, false);
    propPoints = propPoints.filter(x=>x.id!==p.id);
    propSel = null; propDraft = null;
    document.getElementById('p_name').value=''; document.getElementById('p_note').value='';
    renderProp();
  }catch(e){ alert('削除に失敗しました。'); }
});

/* メモ（節）ごとのペラ情報: 「ペラ(n)」ボタンから開く。画面と動きはペラ表と同じ */
function openMemoProp(memoId){
  if(!setupEntries.some(e=>e.id===memoId)) return;
  const onVenue = document.getElementById('viewVenue').classList.contains('active');
  propReturn = { tab: onVenue ? 'venue' : 'search', venue: browsingVenue, memoId };
  propScope = memoId; propSel = null; propDraft = null;
  document.getElementById('p_name').value = ''; document.getElementById('p_note').value = '';
  ['viewSearch','viewVenue'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('viewProp').classList.add('active');
  renderProp();
  window.scrollTo({ top:0 });
}
/* 右上に固定表示する「ペラ(n)」: 開いたメモを読んでスクロールしている間、いま見えているメモのペラに切り替わる */
(function(){
  const fb = document.createElement('button');
  fb.type = 'button'; fb.className = 'prop-btn prop-float'; fb.style.display = 'none';
  document.body.appendChild(fb);
  let curId = null;
  function update(){
    let found = null;
    const onList = ['viewSearch','viewVenue'].some(id=>document.getElementById(id).classList.contains('active'));
    if(onList){
      const cards = document.querySelectorAll('.setup-entry.open');
      for(const c of cards){
        const r = c.getBoundingClientRect();
        const head = c.querySelector('.setup-head').getBoundingClientRect();
        // カード上部のボタンが画面の上に隠れ、本文がまだ見えているメモ
        if(head.bottom < 60 && r.bottom > 80){ found = c; break; }
      }
    }
    if(!found){ fb.style.display = 'none'; curId = null; return; }
    const id = found.getAttribute('data-id');
    const e = setupEntries.find(x=>x.id===id);
    const n = propPoints.filter(p=>p.memoId===id).length;
    const label = (e && e.venue ? e.venue+' ' : '') + 'ペラ(' + n + ')';
    if(fb.textContent !== label) fb.textContent = label;
    curId = id; fb.style.display = 'block';
  }
  fb.addEventListener('click', ()=>{ if(curId) openMemoProp(curId); });
  window.addEventListener('scroll', update, { passive:true });
  window.addEventListener('resize', update);
  document.addEventListener('click', ()=>setTimeout(update, 0));
  setInterval(update, 500);
})();
document.getElementById('propBackBtn').addEventListener('click', ()=>{
  const ret = propReturn || { tab:'search' };
  switchTab(ret.tab);               // ここでメモごとの表示を終了する
  if(ret.tab === 'venue' && ret.venue){ browsingVenue = ret.venue; renderVenueTab(); }
  renderSetup();                    // 「ペラ(n)」の数を更新
  const box = ret.tab === 'venue' ? '#venueDetailList' : '#setupListArea';
  const card = document.querySelector(`${box} .setup-entry[data-id="${CSS.escape(String(ret.memoId))}"]`);
  if(card){ card.classList.add('open'); card.scrollIntoView({ block:'start' }); }
  propReturn = null;
});

/* ================= BACKUP ================= */
function backupFileName(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `メモ_バックアップ_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const status = document.getElementById('backupStatus');
  if(!setupEntries.length && !propPoints.length){ status.textContent = '書き出せる記録がまだありません。'; return; }
  try{
    const payload = {
      app: 'setup-memo',
      version: 2,
      exportedAt: new Date().toISOString(),
      entries: setupEntries,
      props: propPoints
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = backupFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    status.textContent = `メモ${setupEntries.length}件・ペラ${propPoints.length}点を書き出しました。「ファイル」アプリやiCloudなど、消えない場所に保存してください。`;
  }catch(e){
    status.textContent = '書き出しに失敗しました(' + (e && e.message ? e.message : '原因不明') + ')。';
  }
});

document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('backupInput').click());

document.getElementById('backupInput').addEventListener('change', async (ev)=>{
  const file = (ev.target.files || [])[0];
  ev.target.value = '';
  if(!file) return;
  const status = document.getElementById('backupStatus');
  status.textContent = '読み込み中…';

  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const incoming = Array.isArray(payload) ? payload : (payload.entries || []);
    const incomingProps = (!Array.isArray(payload) && Array.isArray(payload.props)) ? payload.props : [];
    if(!Array.isArray(incoming) || (!incoming.length && !incomingProps.length)){
      throw new Error('記録が見つかりませんでした');
    }

    const existingIds = new Set(setupEntries.map(e=>e.id));
    let added = 0, skipped = 0;

    for(const raw of incoming){
      if(!raw || typeof raw !== 'object') continue;
      const rid = safeId(raw.id);
      if(rid && existingIds.has(rid)){ skipped++; continue; }
      const entry = migrate({
        id: rid || genId('s'),
        body: String(raw.body || ''),
        venue: String(raw.venue || ''),
        period: String(raw.period || ''),
        date: String(raw.date || ''),
        engine: String(raw.engine || ''),
        temp: String(raw.temp || ''),
        press: String(raw.press || ''),
        prop: String(raw.prop || ''),
        maint: String(raw.maint || ''),
        createdAt: Number(raw.createdAt) || Date.now()
      });
      await window.storage.set('setup:'+entry.id, JSON.stringify(entry), false);
      setupEntries.push(entry);
      existingIds.add(entry.id);
      added++;
    }

    setupEntries.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt-a.createdAt));
    // ペラ表の点
    const propIds = new Set(propPoints.map(p=>p.id));
    let propAdded = 0;
    for(const raw of incomingProps){
      const pid = safeId(raw && raw.id);
      if(!raw || typeof raw !== 'object' || !pid || propIds.has(pid)) continue;
      const p = {
        id: pid, name: String(raw.name || 'ペラ'), note: String(raw.note || ''),
        x: clampUnit(Number(raw.x) || 0), y: clampUnit(Number(raw.y) || 0),
        color: safeColor(raw.color, PROP_COLORS[propPoints.length % PROP_COLORS.length]),
        createdAt: Number(raw.createdAt) || Date.now()
      };
      if(safeId(raw.memoId)) p.memoId = safeId(raw.memoId);
      await window.storage.set('prop:'+p.id, JSON.stringify(p), false);
      propPoints.push(p); propIds.add(p.id); propAdded++;
    }

    rebuildFilters(); renderSetup(); renderVenueTab(); renderProp();
    status.textContent = `メモ${added}件` + (incomingProps.length ? `・ペラ${propAdded}点` : '') + 'を読み込みました。' + (skipped ? `（重複${skipped}件はそのままです）` : '');
  }catch(e){
    status.textContent = '読み込みに失敗しました(' + (e && e.message ? e.message : '原因不明') + ')。バックアップファイルを選んでいるかご確認ください。';
  }
});
